name: CI
on: [push, pull_request]

jobs:
  unit:
    name: Unit + Integration tests + coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: pcov          # D-06: PCOV installed at system level; no composer dep
      - run: composer validate --strict --no-plugins
      - run: composer install --no-interaction --no-progress
      - run: composer test
      - run: composer test-coverage    # D-07: per-module 70% gate via tools/check-coverage.php
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-clover
          path: build/coverage/clover.xml
          if-no-files-found: warn

  smoke:
    name: Plugin-load smoke (scratch-Craft expected config gate)
    runs-on: ubuntu-latest
    needs: unit       # D-18: gate on unit pass; saves CI minutes on broken unit
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Bootstrap scratch Craft 5
        # Pin to the supported major (composer requires craftcms/cms ^5.0).
        # Without the constraint, the smoke job would silently install Craft 6
        # the moment it ships, producing a confusing solver failure or a
        # half-installed scratch site (Phase 5 review MEDIUM #2). Bump
        # deliberately when Phase 6 / Craft 6 work begins.
        run: |
          composer create-project "craftcms/craft:^5.0" scratch-craft \
            --no-interaction --prefer-dist --no-progress

      - name: Register plugin as path repository + install
        working-directory: scratch-craft
        run: |
          composer config repositories.plugin path ../plugin
          composer require lameco/craft-kunstmaan-migrator @dev \
            --no-interaction --no-progress

      - name: Plugin-load smoke (plugin installs; missing legacy config is expected)
        working-directory: scratch-craft
        env:
          CRAFT_ENVIRONMENT: dev
        run: |
          set +e
          OUTPUT="$(./craft kuma-loader/doctor 2>&1)"
          STATUS="$?"
          set -e
          printf '%s\n' "$OUTPUT"
          if [ "$STATUS" -eq 0 ]; then
            echo "Doctor passed with explicit scratch-site configuration."
            exit 0
          fi

          # Doctor's own exit code isn't a reliable smoke signal here: a bare
          # scratch install legitimately fails checks like state_table (the
          # plugin hasn't been through `plugin/install`, so the migrator's
          # state table doesn't exist yet). Task 6 rewrote doctor to emit
          # pure JSON (rows shaped like {"check":"state_table","ok":...}),
          # replacing the old "Legacy DB / Kunstmaan source path / Anthropic
          # / FAIL" text this step used to grep for — that prose is gone, so
          # grepping it would always miss and, under GitHub Actions' default
          # `bash -eo pipefail`, abort this step on every single run. Assert
          # the JSON shape instead, guarded by `if` (not a bare pipe) so a
          # miss here fails the smoke job deliberately rather than via
          # pipefail: this only trips on an unknown-command or fatal PHP
          # error, which is what this smoke job actually needs to catch.
          if ! printf '%s\n' "$OUTPUT" | php -r 'json_decode(stream_get_contents(STDIN), true, 512, JSON_THROW_ON_ERROR);' > /dev/null 2>&1; then
            echo "::error::doctor did not emit valid JSON (unknown command or fatal error?)"
            exit 1
          fi
          if ! printf '%s\n' "$OUTPUT" | grep -q '"check":"state_table"'; then
            echo "::error::doctor JSON is missing the expected state_table check"
            exit 1
          fi
          echo "Doctor ran and returned valid JSON with known checks (command exit status was ${STATUS}); plugin command loaded successfully."
