name: CI
on: [push, pull_request]

jobs:
  unit:
    name: Unit + Integration tests + coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: pcov          # D-06: PCOV installed at system level; no composer dep
      - run: composer validate --strict --no-plugins
      - run: composer install --no-interaction --no-progress
      - run: composer test
      - run: composer test-coverage    # D-07: per-module 70% gate via tools/check-coverage.php
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-clover
          path: build/coverage/clover.xml
          if-no-files-found: warn

  smoke:
    name: Plugin-load smoke (scratch-Craft install + doctor gate)
    runs-on: ubuntu-latest
    needs: unit       # D-18: gate on unit pass; saves CI minutes on broken unit

    # Craft reads its installed-plugin list from the `plugins` table, so a
    # scratch site with no database loads no plugins and `kunstmaan-migrator/*`
    # does not exist as a console command (issue #18). The smoke job therefore
    # needs a real database, a real `install/craft`, and a real
    # `plugin/install` before any plugin command can be invoked.
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: craft
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      CRAFT_ENVIRONMENT: dev          # doctor refuses to run under `production` (NeverProductionTrait)
      CRAFT_DB_DRIVER: mysql
      CRAFT_DB_SERVER: 127.0.0.1
      CRAFT_DB_PORT: '3306'
      CRAFT_DB_DATABASE: craft
      CRAFT_DB_USER: root
      CRAFT_DB_PASSWORD: root
      CRAFT_DB_TABLE_PREFIX: ''
      CRAFT_APP_ID: CraftCMS--smoke
      CRAFT_SECURITY_KEY: smoke-key-not-a-secret

    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, intl, zip

      - name: Bootstrap scratch Craft 5
        # Pin to the supported major (composer requires craftcms/cms ^5.0).
        # Without the constraint, the smoke job would silently install Craft 6
        # the moment it ships, producing a confusing solver failure or a
        # half-installed scratch site (Phase 5 review MEDIUM #2). Bump
        # deliberately when Phase 6 / Craft 6 work begins.
        #
        # --no-scripts: the starter project's post-create hook is an
        # interactive `setup/welcome`; the .env it would write is written
        # below instead, from the same values the job env already carries.
        run: |
          composer create-project "craftcms/craft:^5.0" scratch-craft \
            --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Register plugin as path repository + install
        working-directory: scratch-craft
        run: |
          composer config repositories.plugin path ../plugin
          composer require lameco/craft-kunstmaan-migrator @dev \
            --no-interaction --no-progress

      - name: Install Craft against the scratch database
        working-directory: scratch-craft
        run: |
          # Craft's bootstrap loads .env immutably, so these duplicate the job
          # env rather than override it — they exist so the file is present and
          # a failing step's `cat .env` tells the whole story.
          {
            echo "CRAFT_ENVIRONMENT=${CRAFT_ENVIRONMENT}"
            echo "CRAFT_APP_ID=${CRAFT_APP_ID}"
            echo "CRAFT_SECURITY_KEY=${CRAFT_SECURITY_KEY}"
            echo "CRAFT_DB_DRIVER=${CRAFT_DB_DRIVER}"
            echo "CRAFT_DB_SERVER=${CRAFT_DB_SERVER}"
            echo "CRAFT_DB_PORT=${CRAFT_DB_PORT}"
            echo "CRAFT_DB_DATABASE=${CRAFT_DB_DATABASE}"
            echo "CRAFT_DB_USER=${CRAFT_DB_USER}"
            echo "CRAFT_DB_PASSWORD=${CRAFT_DB_PASSWORD}"
          } > .env

          php craft install/craft \
            --interactive=0 \
            --username=admin \
            --email=admin@example.com \
            --password=SmokeTest123! \
            --site-name=Smoke \
            --site-url=http://localhost:8080 \
            --language=en-US

      - name: Install the plugin into Craft
        working-directory: scratch-craft
        run: php craft plugin/install kunstmaan-migrator

      - name: Plugin-load smoke (doctor emits its JSON check rows)
        working-directory: scratch-craft
        run: |
          set +e
          OUTPUT="$(php craft kunstmaan-migrator/doctor 2>&1)"
          STATUS="$?"
          set -e
          printf '%s\n' "$OUTPUT"

          # Doctor's own exit code isn't the smoke signal: a scratch site
          # legitimately fails informational-turned-hard checks (no legacy DB,
          # no LEGACY_MEDIA_PATH). What this job guards is that the plugin
          # installs cleanly from a fresh Craft and its console command loads
          # at all — so assert the JSON shape doctor emits, guarded by `if`
          # (not a bare pipe) so a miss fails deliberately rather than via
          # GitHub Actions' default `bash -eo pipefail`.
          if ! printf '%s\n' "$OUTPUT" | php -r 'json_decode(stream_get_contents(STDIN), true, 512, JSON_THROW_ON_ERROR);' > /dev/null 2>&1; then
            echo "::error::doctor did not emit valid JSON (unknown command or fatal error?)"
            exit 1
          fi
          if ! printf '%s\n' "$OUTPUT" | grep -q '"check":"state_table"'; then
            echo "::error::doctor JSON is missing the expected state_table check"
            exit 1
          fi
          if ! printf '%s\n' "$OUTPUT" | grep -q '"check":"state_table","ok":true'; then
            echo "::error::state_table check failed — the plugin did not install cleanly"
            exit 1
          fi
          echo "Plugin installed and doctor loaded (doctor exit status ${STATUS})."
