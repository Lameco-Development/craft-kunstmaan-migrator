handle: heroBanner
name: 'Hero Banner'
fieldLayouts:
  abab3434:
    tabs:
      -
        elementCondition: null
        elements:
          -
            # Required only when the hero is a slider — the berkvensNlContentPage.heroSlides shape.
            elementCondition:
              class: craft\elements\conditions\entries\EntryCondition
              conditionRules:
                -
                  class: craft\fields\conditions\OptionsFieldConditionRule
                  fieldUid: ffff8888
                  operator: in
                  uid: abab5656
